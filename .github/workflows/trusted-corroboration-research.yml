name: Trusted Corroboration Research

on:
  push:
    branches:
      - security/trusted-corroboration-gates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff
      - name: Lint research files
        run: |
          ruff check src/agent_memory_guard/corroboration_research.py tests/test_corroboration_research.py
      - name: Run adversarial tests
        run: |
          python -m pytest tests/test_corroboration_research.py -v
